services:
  backend:
    build:
      context: ./backend
    environment:
      LBL_API_URL: http://logbirting-search-backend-1:8000
      DOMAR_API_URL: http://domar-search-backend-1:8000
      ST_API_URL: http://stjornartidindi-search-backend-1:8000
      LBL_PUBLIC_URL: https://lbl.dsna.codes
      DOMAR_PUBLIC_URL: https://judgements.dsna.codes
      ST_PUBLIC_URL: https://stjornartidindi.dsna.codes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "192.168.0.3:8003:8000"
    networks:
      - default
      - lbl
      - domar
      - st

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: ""
      VITE_DEV_API_PROXY: http://backend:8000
    ports:
      - "192.168.0.3:5175:5173"
    depends_on:
      - backend
    networks:
      - default

networks:
  default:
    # Must not overlap the host LAN (192.168.0.0/24). Docker Desktop's default
    # pool used 192.168.0.0/20 here; kvik-nginx then routed 192.168.0.3 to the
    # bridge instead of the host and every LAN-published upstream 502'd.
    ipam:
      config:
        - subnet: 172.32.0.0/16
  lbl:
    external: true
    name: logbirting-search_default
  domar:
    external: true
    name: domar-search_default
  st:
    external: true
    name: stjornartidindi-search_default
